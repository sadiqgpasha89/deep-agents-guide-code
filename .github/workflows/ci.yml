name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python syntax
        run: ruff check --no-cache --select E9,F63,F7 --ignore F704 chapters build-alongs scripts
      - name: JSON validity
        run: python scripts/check_json.py

  imports:
    name: Import check against current packages (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_imports.py
